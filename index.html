    <script>
        const HORARIOS_PADRAO = ["08:00", "09:00", "10:00", "11:00", "14:00", "15:00", "16:00", "17:00", "18:00"];

        document.addEventListener("DOMContentLoaded", () => { 
            carregarServicos(); 
            carregarProfissionais(); 
            document.getElementById('dataAgenda').addEventListener('change', atualizarHorariosDisponiveis); 
            document.getElementById('selectProfissional').addEventListener('change', atualizarHorariosDisponiveis); 
        });

        async function carregarServicos() { 
            const { data, error } = await supabase.from('servicos').select('*').order('nome'); 
            const select = document.getElementById('selectServico'); 
            if (error) { select.innerHTML = '<option value="">Erro ao carregar</option>'; return; } 
            select.innerHTML = '<option value="">Selecione...</option>'; 
            data.forEach(s => { select.innerHTML += `<option value="${s.id}|${s.nome}|${s.preco}">${s.nome} - R$ ${parseFloat(s.preco).toFixed(2)}</option>`; }); 
        }

        async function carregarProfissionais() { 
            const { data, error } = await supabase.from('funcionarios').select('*').order('nome'); 
            const select = document.getElementById('selectProfissional'); 
            if (error) { select.innerHTML = '<option value="">Erro ao carregar</option>'; return; } 
            select.innerHTML = '<option value="">Qualquer profissional disponível</option>'; 
            data.forEach(f => { select.innerHTML += `<option value="${f.id}|${f.nome}">${f.nome}</option>`; }); 
        }

        async function atualizarHorariosDisponiveis() { 
            const dataSel = document.getElementById('dataAgenda').value; 
            const profSel = document.getElementById('selectProfissional').value; 
            const selectHora = document.getElementById('horaAgenda'); 
            if (!dataSel) return; 
            selectHora.innerHTML = '<option value="">Buscando horários...</option>'; 
            let query = supabase.from('agendamentos').select('horario_agenda').eq('data_agenda', dataSel).neq('status', 'Cancelado'); 
            if (profSel) { const profId = profSel.split('|')[0]; query = query.eq('funcionario_id', profId); } 
            const { data: agendados, error } = await query; 
            if (error) { selectHora.innerHTML = '<option value="">Erro ao buscar horários</option>'; return; } 
            const horasOcupadas = agendados.map(a => a.horario_agenda.substring(0, 5)); 
            const horasLivres = HORARIOS_PADRAO.filter(h => !horasOcupadas.includes(h)); 
            selectHora.innerHTML = '<option value="">Selecione...</option>'; 
            if (horasLivres.length === 0) { selectHora.innerHTML = '<option value="">Nenhum horário livre</option>'; } 
            else { horasLivres.forEach(h => { selectHora.innerHTML += `<option value="${h}">${h}</option>`; }); } 
        }

        async function processarAgendamento(e) { 
            e.preventDefault(); 
            const nome = document.getElementById('nomeCliente').value; 
            const whatsapp = document.getElementById('whatsappCliente').value; 
            const servicoRaw = document.getElementById('selectServico').value.split('|'); 
            const profRaw = document.getElementById('selectProfissional').value.split('|'); 
            const data = document.getElementById('dataAgenda').value; 
            const hora = document.getElementById('horaAgenda').value; 
            const formaPagamento = document.querySelector('input[name="pagamento"]:checked').value;
